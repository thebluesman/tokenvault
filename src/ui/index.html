<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tokenvault</title>
    <style>
      /*
        ==========================================================================================
        Dark mode — Phase 10, UX `docs/ux/dark-mode.md`.

        Four `:root` blocks and nothing else (§2.2). **No component selector ever gets a theme
        variant**: if a rule needs a `.tv-dark` override, that rule has a hardcoded colour that
        should have been a custom property, and §3's audit exists so that none are left.
        `test/darkMode.test.ts` pins both halves of that.

        Two independent facts are in play (§2.1):

          - **Figma's theme**, learned from the `figma-light` / `figma-dark` class Figma stamps on
            `<html>` because `code.ts` passes `themeColors: true`. Never ours to set.
          - **The panel's effective theme** — Figma's when the Appearance setting is Auto, and the
            setting's own value otherwise. An override stamps `tv-light` / `tv-dark` *beside*
            Figma's class; Auto stamps nothing and costs zero lines of script.

        Figma's injected `--figma-color-*` variables always describe **Figma's** theme, so they can
        only be trusted where the two facts agree. Blocks 1–2 below are the effective theme and
        carry the entire palette from the snapshot literals; blocks 3–4 repoint *only the neutrals*
        at Figma's variables, and only in the two cells where the facts agree. Equal specificity
        with block 2 means source order decides, which is why they come last.

        | Figma | Setting        | Effective | Neutrals from        |
        |-------|----------------|-----------|----------------------|
        | Light | Auto or Light  | Light     | `--figma-color-*`    |
        | Dark  | Auto or Dark   | Dark      | `--figma-color-*`    |
        | Dark  | Light          | Light     | light snapshot below |
        | Light | Dark           | Dark      | dark snapshot below  |

        The snapshot is Figma's own values written down, not a second palette maintained by eye. It
        also serves as the `var()` fallback if a future Figma release stops injecting something we
        read — which is why every reference in blocks 3–4 carries one.
        ==========================================================================================
      */

      /* ---- Block 1: effective light — snapshot neutrals + light semantics ---------------- */
      :root {
        /* Explicit, not merely left unset, so a `tv-light` panel inside a *dark* Figma still gets
           light scrollbars, selects, checkboxes and colour inputs rather than the host's (§6.5). */
        color-scheme: light;

        /* -- Neutrals (§4.1). Sourced from Figma in blocks 3–4; these are the snapshot. -- */
        --bg: #ffffff;
        --bg-raised: #ffffff;
        --bg-subtle: #f5f5f5;
        --text: #1a1a1a;
        --muted: #8c8c8c;
        --border: #e6e6e6;
        /* Text on *our* --accent and --danger fills, which stay ours in both themes. Figma's
           `text-onbrand` is tuned to Figma's brand fill, not ours, so this is not sourced. */
        --on-fill: #ffffff;

        /*
          -- The four semantic colours (§4.2). Hand-authored in both themes: Figma's variable set
          has no equivalent and never will — its `bg-warning` / `bg-danger` tints are for Figma's
          own banners, not for a four-value language with a documented ranking (§5).

          --ok is the "agreed" green: muted and desaturated, deliberately quieter than the amber
          it sits beside, because a confirmation must never out-shout a warning. It appears in
          exactly three places — the header chip, the detail overlay's per-set in-sync line, and
          the apply dialog's `already matches` rows — and never on a tree row or a value line,
          where in-sync stays signalled by the *absence* of a badge across 1,316 tokens.

          --danger is a **button and menu-label colour, not a state colour**. Phase 4's ban on a
          third badge colour is intact: nothing in a row or a banner turns red. Red here means
          exactly one thing — this control destroys something in the file, and no second apply
          brings it back. The `--danger` / `--danger-text` split below is a dark-mode legibility
          fix and **does not widen where red is allowed** (§5.3): still exactly two sites.
        */
        --accent: #0d99ff;
        --accent-text: #0d99ff;
        --warn: #b8730a;
        --warn-bg: #fff6e5;
        --ok: #2f7d55;
        --ok-bg: #eef7f1;
        --danger: #c4382f;
        --danger-text: #c4382f;

        /* -- Everything else (§4.3) -- */
        --mark-bg: #fff2a8;
        /* The swatch ring and the checkerboard have to stay legible against a background we no
           longer choose (§6.3). Both are expressed against the panel's own ground rather than a
           tuned hairline, so they hold whatever that ground turns out to be. */
        --swatch-ring: rgba(0, 0, 0, 0.4);
        /* How much of that ring the row-level chip actually draws — `local-editor.md` §4.5,
           `dark-mode.md` §6.3, both amended 2026-09-07. A full-strength hairline around a 16px
           circle reads as a border *on* the colour; at this alpha it reads as an edge *under* it.
           Deliberately not zero: the ring's whole job is stopping a `#000000` token vanishing into
           the panel floor, and that job survives the change. Theme-independent — it scales whatever
           `--swatch-ring` each block resolved to, so the sourced-not-tuned rule of §6.3 holds. */
        --swatch-ring-alpha: 0.45;
        /* The row-level chip's diameter. The 8px strip dot is *not* derived from this: since
           2026-09-07 the two shapes diverge on purpose (circle vs. square), so tying them to one
           number would only invite a future "fix" that re-unified them. 16px is the largest circle
           that still fits `.vline`'s 18px row without pushing it. */
        --swatch-size: 16px;
        --checker-a: var(--bg);
        --checker-b: var(--border);
        /* Light keeps an authored near-black: the toast is deliberately the one inverted surface
           in the panel, and no Figma variable means "inverted chrome". */
        --toast-bg: #1a1a1a;
        --toast-text: #ffffff;
        --toast-action: #7cc4ff;
        --scrim: rgba(0, 0, 0, 0.32);
        --shadow-pop: 0 4px 14px rgba(0, 0, 0, 0.14);
        --shadow-modal: 0 8px 28px rgba(0, 0, 0, 0.24);
        --fill-hover: brightness(0.93);
      }

      /* ---- Block 2: effective dark — snapshot neutrals + dark semantics ------------------ */
      :root.tv-dark,
      :root.figma-dark:not(.tv-light) {
        color-scheme: dark;
        /* Light-on-dark text renders visually heavier on macOS; this thins it back toward the
           light-mode weight at 11px (§6.6). Type is otherwise untouched — same stacks, same
           sizes, same weights. */
        -webkit-font-smoothing: antialiased;

        /* -- Neutrals: the dark snapshot (§4.1) --
           In dark, elevation is a *lighter surface*, not a shadow: a black shadow on a dark ground
           barely reads (§6.1). --bg-raised being lighter than --bg is what makes an overlay read
           as above the panel, and the shadows below become edge separation rather than the cue. */
        --bg: #2c2c2c;
        --bg-raised: #383838;
        --bg-subtle: #434343;
        --text: #e8e8e8;
        --muted: #a8a8a8;
        --border: #4d4d4d;

        /* -- Semantics. `--accent` and `--danger` stay put: they are fills carrying --on-fill,
           and matching Figma's own primary blue is worth more here than the ratio. Their `-text`
           halves move, because a fill light enough to carry white text is too light to read as
           text on a dark ground.

           **The green must stay quieter than the amber** (§5.1, apply-and-drift §8). --ok sits
           below --warn by contrast ratio, deliberately. This is the one ratio in the palette that
           must not be "improved": lifting --ok to match --warn inverts the ranking and breaks the
           rule that a confirmation never out-shouts a warning. If a future contrast pass wants to
           lift --ok, it has to lift --warn further first. -- */
        --accent-text: #66b5ff;
        --warn: #e0a33c;
        --warn-bg: #3a2f1c;
        --ok: #6fae87;
        --ok-bg: #24352b;
        --danger-text: #ef7f76;

        /* A wash, not a highlighter (§4.3, §9.3): `.tname mark` inherits its colour, so a pale
           yellow ground here would put near-white text on near-white. */
        --mark-bg: #6b5a10;
        --swatch-ring: rgba(255, 255, 255, 0.4);
        /* The toast gets *lighter*, not darker (§6.2) — one step up from the raised surface, the
           same direction elevation goes. A white chip at 460px reads as a modal, not a transient
           line. Repointed at Figma's `bg-tertiary` in block 4. */
        --toast-bg: #434343;
        --toast-text: var(--text);
        --toast-action: #8fcdff;
        /* Dimming a dark surface takes more alpha to read as dimmed. */
        --scrim: rgba(0, 0, 0, 0.55);
        --shadow-pop: 0 4px 14px rgba(0, 0, 0, 0.45);
        --shadow-modal: 0 8px 28px rgba(0, 0, 0, 0.5);
        /* Darkening a fill on a dark ground reads as *receding* — the opposite of a hover (§6.4). */
        --fill-hover: brightness(1.12);
      }

      /* ---- Block 3: Figma light and the panel agrees — neutrals come from Figma --------- */
      :root:not(.figma-dark):not(.tv-dark) {
        --bg: var(--figma-color-bg, #ffffff);
        /* In light, elevation is carried by shadow and border rather than by lightness, exactly
           as it always has been — raised is identical to the floor (§4.1). */
        --bg-raised: var(--figma-color-bg, #ffffff);
        --bg-subtle: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1a1a1a);
        --muted: var(--figma-color-text-secondary, #8c8c8c);
        --border: var(--figma-color-border, #e6e6e6);
        /* `border-strong` rather than `border`: at chip scale — and especially once the row chip
           draws it at `--swatch-ring-alpha` — a stronger source line is what separates a swatch from
           a hairline nobody notices. Falls back to `border`, never to a literal (§6.3). */
        --swatch-ring: var(--figma-color-border-strong, var(--figma-color-border, rgba(0, 0, 0, 0.4)));
      }

      /* ---- Block 4: Figma dark and the panel agrees — neutrals come from Figma ---------- */
      :root.figma-dark:not(.tv-light) {
        --bg: var(--figma-color-bg, #2c2c2c);
        /* `bg-secondary` flips role with the theme — recessed in light, raised in dark — which is
           why this mapping is per-theme and not one line (§4.1). */
        --bg-raised: var(--figma-color-bg-secondary, #383838);
        --bg-subtle: var(--figma-color-bg-tertiary, #434343);
        --text: var(--figma-color-text, #e8e8e8);
        --muted: var(--figma-color-text-secondary, #a8a8a8);
        --border: var(--figma-color-border, #4d4d4d);
        --swatch-ring: var(--figma-color-border-strong, var(--figma-color-border, rgba(255, 255, 255, 0.4)));
        --toast-bg: var(--figma-color-bg-tertiary, #434343);
      }

      /* Held until the stored Appearance value has arrived and its class is stamped (§2.4) —
         otherwise an overriding user sees a frame of the other theme on every open. `tv-painted`
         is set by the `plugin-ready` handler, and by a short failsafe timer so a main thread that
         never answers gives us a themed panel rather than a blank one. */
      :root:not(.tv-painted) body {
        visibility: hidden;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 11px;
        line-height: 1.45;
        color: var(--text);
        /* The panel floor. Transparent would borrow whatever Figma paints behind the iframe. */
        background: var(--bg);
      }
      header {
        flex: none;
        z-index: 2;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
      }
      .header-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
      }
      .header-row + .header-row {
        padding-top: 0;
      }
      header h1 {
        flex: 1;
        font-size: 12px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs {
        display: flex;
        gap: 2px;
        flex: 1;
      }
      .tab {
        padding: 3px 10px;
        border-radius: 5px;
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
      }
      .tab.active {
        background: var(--bg-subtle);
        border-color: var(--border);
        color: var(--text);
      }
      .tab:disabled {
        opacity: 0.45;
        cursor: default;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        cursor: pointer;
      }
      button:hover {
        background: var(--bg-subtle);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-fill);
      }
      button.primary:hover {
        filter: var(--fill-hover);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      select,
      input[type="text"],
      input[type="search"],
      textarea.field,
      textarea.desc-input {
        font: inherit;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: inherit;
      }
      input:disabled {
        background: var(--bg-subtle);
        color: var(--muted);
      }
      input.invalid {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      section {
        margin-bottom: 18px;
      }
      section > h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .count {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 5px 8px;
        min-width: 62px;
      }
      .count b {
        display: block;
        font-size: 14px;
      }
      .count span {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .row .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row .meta {
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 10px;
        background: var(--bg-subtle);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.needs {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
      }
      .entry {
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
      }
      .entry .kind {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--warn);
      }
      /* partial-token / redundant-style: imported, not lost — so not styled as a failure. */
      .entry.info {
        border-left-color: var(--border);
      }
      .entry.info .kind {
        color: var(--muted);
      }
      .entry > div:first-child {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      details.file {
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 6px;
      }
      details.file > summary {
        cursor: pointer;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      details.file > summary .grow {
        flex: 1;
      }
      pre {
        margin: 0;
        padding: 8px;
        background: var(--bg-subtle);
        border-top: 1px solid var(--border);
        max-height: 260px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .empty {
        color: var(--muted);
      }

      /* ---- Onboarding polish (Phase 10, onboarding-polish.md) ---- */

      /* §6.1 — two headings, not two colours. The band is what tells the reader which kind of
         number they are looking at; making the second one amber would say "132 problems" louder
         than the flat row said it by accident. */
      .band-head {
        color: var(--muted);
        margin: 0 0 4px;
      }
      .counts + .band-head {
        margin-top: 10px;
      }
      /* §5.3's group header — the same caret row the tree already has, with two controls on it. */
      .group-head .caret-btn {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        padding: 0;
        text-align: left;
      }
      .group-head .grow {
        flex: 1;
      }
      /* §4.2's disclosure. Not a `<details>`: its open state has to survive a full re-render of the
         settings body, which is driven by `draft.howOpen` rather than by the element. */
      .disclosure {
        margin: 6px 0;
      }
      .disclosure-head {
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
        padding: 0;
      }
      .disclosure-body {
        border-left: 2px solid var(--border);
        padding: 4px 0 4px 8px;
        margin-top: 4px;
      }
      .disclosure-body .step {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 3px 0;
      }
      .disclosure-body .step-n {
        color: var(--muted);
        min-width: 12px;
      }
      .disclosure-body .grow {
        flex: 1;
      }
      /* §7.1's strip. One drawing, three placements — the highlighted place is the only thing that
         differs between them, and it borrows the panel's own text colour rather than adding one. */
      /*
        A prose measure — `panel-size-and-swatches.md` §3.4.

        The panel resizes without breakpoints and without layout modes: extra width is spent on
        breathing room, never built on. Body copy is the one thing that gets actively worse with more
        of it, so the prose surfaces (`How Tokenvault works`, the crash screen, the three-place
        explainer) cap at roughly 64 characters and stay **left-aligned** — centring them in the
        leftover space would be worse than either extreme.
      */
      .measure {
        max-width: 64ch;
      }
      .three-place-strip {
        max-width: 64ch;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        margin-bottom: 10px;
        background: var(--bg-subtle);
      }
      .three-place .tp-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        font-size: 11px;
      }
      .tp-place {
        color: var(--muted);
      }
      .tp-place.on {
        color: var(--text);
        font-weight: 600;
      }
      .tp-arrow,
      .tp-back {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .tp-back {
        margin-top: 3px;
      }
      .tp-line {
        margin: 6px 0 0;
      }
      .hidden {
        display: none !important;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* ---------------- Tokens tab (Phase 4) ---------------- */

      #tokens {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .filters {
        flex: none;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filters input[type="search"] {
        width: 100%;
        padding: 4px 6px;
      }
      .chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 2px 7px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .chip.on {
        border-color: var(--accent-text);
        color: var(--accent-text);
      }
      .chip.warn.on {
        border-color: var(--warn);
        color: var(--warn);
        background: var(--warn-bg);
      }

      /* --- Phase 6: git sync (UX docs/ux/git-sync.md) --------------------- */

      /* The gear (§5.1). One state mark only: amber when the connection is broken. A settings icon
         that is decorated when everything is fine teaches the user to ignore its decoration. */
      .gear {
        flex: none;
        padding: 2px 6px;
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
      }
      .gear.needs {
        color: var(--warn);
        border-color: var(--warn);
        background: var(--warn-bg);
      }

      /* One chip, two halves, split by a hairline divider — §6.1. Left is Figma, right is the repo,
         and the divider is doing semantic work rather than decoration: it is what makes "in sync
         with what" answerable without a word. Two tap targets, two destinations (§4.1). */
      .sync-chip {
        display: inline-flex;
        align-items: stretch;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg);
      }
      .sync-chip > button {
        border: none;
        background: none;
        color: var(--muted);
        padding: 2px 7px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .sync-chip > button + button {
        border-left: 1px solid var(--border);
      }
      .sync-chip.on {
        border-color: var(--accent-text);
      }
      .sync-chip.on > button {
        color: var(--accent-text);
      }
      .sync-chip.warn {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      .sync-chip.warn > button {
        color: var(--warn);
      }
      .sync-chip > button.ok {
        color: var(--ok);
      }

      #repo,
      #settings {
        position: absolute;
        inset: 0;
        background: var(--bg-raised);
        display: flex;
        flex-direction: column;
      }
      #repo {
        z-index: 5;
      }
      /* Above the Changes panel (20) because Settings is reachable from every tab, and below the
         modal (30) because the phase's one modal — first connect — opens over Settings. Stated as
         numbers rather than left to document order: a connect question rendered *under* the
         overlay that raised it is unanswerable. */
      #settings {
        z-index: 25;
      }
      #repo .panel-head,
      #settings .panel-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      #repo .panel-head .title,
      #settings .panel-head .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #repo .panel-body,
      #settings .panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      /* The pinned footer every screen in this tab shares — the list scrolls against the panel and
         the write verb never scrolls out of reach (§7.2). */
      .panel-foot {
        flex: none;
        border-top: 1px solid var(--border);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-foot .grow {
        flex: 1;
      }
      .panel-foot .note {
        color: var(--muted);
      }
      /* Files, not tokens, at the top level — §6.2. This is the one place in the panel whose unit
         is a file, because it is the place about the repo (§3). */
      .file-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .file-row .fname {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .file-row .fcount {
        color: var(--muted);
        white-space: nowrap;
      }
      .repo-section {
        margin: 0 0 14px;
      }
      .repo-section > h3 {
        margin: 0 0 4px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .file-children {
        padding: 4px 0 6px 18px;
      }
      .more-line {
        color: var(--muted);
        cursor: pointer;
        padding: 2px 0;
      }
      .msg-field {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 6px;
      }
      /* §10.4's one new component: a footer strip replacing the bulk button in place. Nothing
         dims, nothing overlays, and the rows the user is being asked about stay visible behind it. */
      .confirm-strip {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: 8px;
      }
      .confirm-strip .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .confirm-strip .actions .grow {
        flex: 1;
      }
      /* The token field is write-only and looks it — §5.2, ADR-0006 §1. Inert, never a `value`. */
      .pat-field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pat-mask {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
        color: var(--muted);
        background: var(--bg-subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #tokens-notices {
        flex: none;
        padding: 8px 12px 0;
      }
      #tokens-notices:empty {
        padding: 0;
      }
      #tokens-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        position: relative;
      }
      #tokens-canvas {
        position: relative;
      }
      .tnode {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        overflow: hidden;
      }
      .tnode.group {
        cursor: pointer;
        /* Group rows are *floor*, not raised (§6.1) — they sit above the scroll ground so a
           sticky-feeling header row doesn't show tokens through it, and their distinction from
           token rows stays the font weight and the caret. */
        background: var(--bg);
      }
      .tnode.group:hover,
      .tnode.token:hover {
        background: var(--bg-subtle);
      }
      .tline {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 18px;
      }
      .tline.head {
        height: 20px;
      }
      .caret {
        width: 10px;
        flex: none;
        color: var(--muted);
      }
      .tname {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .tname.group-name {
        font-family: Inter, "Segoe UI", sans-serif;
        font-weight: 500;
      }
      .tname mark {
        background: var(--mark-bg);
        color: inherit;
      }
      .vline {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        min-width: 0;
      }
      .vline .val {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: text;
      }
      .vline .val.readonly {
        cursor: default;
        color: var(--muted);
      }
      .vline .val.edited {
        color: var(--accent-text);
      }
      .setcode {
        flex: none;
        color: var(--muted);
        font-size: 10px;
        min-width: 38px;
      }
      .setcode.derived {
        font-style: italic;
      }
      .glyph {
        flex: none;
        width: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 10px;
      }
      /*
        The swatch renders the user's actual token colour, and its two decorations are the only
        part of it that is ours (§6.3, §7). Both are drawn against a background we no longer
        choose, so neither is a tuned hairline any more:

        - The **ring** is `--swatch-ring`, sourced from Figma's own border colour, drawn at
          `--swatch-ring-alpha`. Figma's border is *defined* as a line that reads against Figma's
          background, and Figma's background is now ours — so the ring is visible against the panel
          floor by construction, including on a release that retunes the floor. That is what stops a
          `#000000` token being an invisible circle. Drawn as an inset shadow rather than a border so
          the box and the checkerboard geometry are unchanged.
        - The **checkerboard** squares are the panel's own ground and its own border, so a
          semi-transparent token composites against exactly the surface it will look like in use —
          and never glows in dark. It survived the move to a circle: the alpha is real, it is just
          now clipped to a disc.

        Circle, `--swatch-size` across, since 2026-09-07 (Shyam's call, `local-editor.md` §4.5): a
        colour is a colour, not a swatch-shaped object, and at this size the round chip reads next to
        11px monospace without competing with it.
      */
      .swatch {
        flex: none;
        position: relative;
        width: var(--swatch-size);
        height: var(--swatch-size);
        border-radius: 50%;
        border: 0;
        background-color: var(--checker-a);
        background-image: linear-gradient(45deg, var(--checker-b) 25%, transparent 25%),
          linear-gradient(-45deg, var(--checker-b) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, var(--checker-b) 75%),
          linear-gradient(-45deg, transparent 75%, var(--checker-b) 75%);
        background-size: 8px 8px;
        background-position: 0 0, 0 4px, 4px -4px, -4px 0;
      }
      /*
        The ring, as its own layer above the fill.

        `opacity` rather than a translucent ring colour, because the colour is Figma's and not ours:
        taking 45% of `var(--figma-color-border-strong)` needs `color-mix`, and if an engine ever
        failed to parse it the whole `box-shadow` would compute to nothing — a `#000000` chip with no
        edge at all, which is the one failure §6.3 exists to prevent. An opacity on a ring layer
        can't fail that way.
      */
      .swatch::after,
      .swatch-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px var(--swatch-ring);
        opacity: var(--swatch-ring-alpha);
        pointer-events: none;
      }
      /* Inside a wrapper the fill above carries the ring, so the base must not draw a second one:
         two 45% rings stacked read as one ~70% ring wherever the fill is semi-transparent, which is
         precisely the chip this change was asked to soften. */
      .swatch-wrap .swatch::after {
        content: none;
      }
      /*
        The wrapper is the `--swatch-size` slot itself, so an **empty** one is the reserved slot of
        `panel-size-and-swatches.md` §4.3: a cycle draws no mark, and its `—` still lands in the same
        column as every sibling's hex. Nothing to paint, which is why `.reserved` adds no properties
        of its own — the class exists so the markup says what the empty box is for. It tracks the
        chip's size off the same variable, so the column can never fall out of step with the circle.
      */
      .swatch-wrap {
        flex: none;
        position: relative;
        width: var(--swatch-size);
        height: var(--swatch-size);
      }
      .swatch-fill {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      /* The "no colour" case: nothing to ring, so a dashed --border is the whole mark — a dashed
         circle at the same size, so it still sits in the same column (§4.2). */
      .swatch.outlined {
        background-image: none;
        border: 1px dashed var(--border);
      }
      .swatch.outlined::after {
        content: none;
      }
      /*
        The collapsed-group swatch strip — `panel-size-and-swatches.md` §5.3, `dark-mode.md` §6.3.

        8px squares, and since 2026-09-07 that is a deliberate divergence rather than an echo: the
        row-level chip became a 16px circle with a faint ring (`local-editor.md` §4.5) and the strip
        dot stayed exactly as shipped — square, 2px radius, full-strength ring. A 6px-ish circle at
        45% ring opacity is a smudge; a small hard square is a legible tick. Do not "reconcile" these
        two. Three departures from the row chip, the last two forced by the size:

        - **Square, full-strength ring** — see above. The strip is a summary you scan, not a colour
          you inspect.

        - **No checkerboard.** At 8px the checker squares are one-and-a-bit squares of noise. The
          dot sits on `--checker-a` — the panel's own ground — as a flat base, so a semi-transparent
          token still composites against the right surface; it just doesn't advertise its alpha,
          which is not readable at 8px anyway.
        - **The ring stays**, and matters more here than on the row chip: it is 1px of an 8px box,
          and it is what stops a `#000000` shade being a hole in a dark panel.

        `min-width: 0` and `overflow: hidden` are what make it §5.1's first element to yield — the
        name, the flag and the count all outrank a preview.
      */
      .strip {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
        /* The lopsided shrink factor *is* §5.1's precedence rule: when the row runs out of width the
           strip gives up its space long before the group name gives up a character. Proportional
           shrinking — the default — would trade one for the other, and the name outranks a preview. */
        flex: 0 100 auto;
      }
      .strip-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background-color: var(--checker-a);
        box-shadow: inset 0 0 0 1px var(--swatch-ring);
      }
      /* A footnote on the strip, not a control: muted, same weight as the right-hand count. */
      .strip-more {
        flex: none;
        margin-left: 2px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .menu-btn {
        flex: none;
        border: none;
        background: none;
        padding: 0 3px;
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
      }
      .menu-btn:hover {
        background: none;
        color: var(--text);
      }
      .count-right {
        flex: none;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .inline-edit {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .popover {
        position: fixed;
        z-index: 40;
        background: var(--bg-raised);
        /* Nearly redundant in light; in dark it is the crisp edge that stops a lighter card from
           looking like a glow (§6.1). */
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow-pop);
        padding: 4px;
        max-width: 300px;
        max-height: 380px;
        overflow: auto;
      }
      .popover .item {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 4px 8px;
        border: none;
        background: none;
        border-radius: 4px;
        text-align: left;
        cursor: pointer;
      }
      .popover .item:hover {
        background: var(--bg-subtle);
      }
      .popover .item:disabled {
        color: var(--muted);
        cursor: default;
      }
      .popover .item:disabled:hover {
        background: none;
      }
      .popover .group-label {
        padding: 4px 8px 2px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
      }

      #panel {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: var(--bg-raised);
        display: flex;
        flex-direction: column;
      }
      #panel .panel-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      /* The title bar *is* the name field — `edit-view-redesign.md` §10.1. The path in mono with
         `Copy path` beside it is the token's identity; there is no editable Name input, because
         ADR-0004 defines no rename op and a field that refuses everything typed into it is worse
         than no field. */
      #panel .panel-head .head-main {
        flex: 1;
        min-width: 0;
      }
      #panel .panel-head .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* One thin meta line under the title, and only on a single-set card: it is where the set code
         and the `edited` / flag badges the dropped `h3` used to carry reappear (§3.2, §12). Not the
         `$type` badge — the value field's own label carries the type now (§4.2). */
      #panel .panel-head .head-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        font-size: 10px;
        color: var(--muted);
      }
      #panel .panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      /* The pinned footer — `Done` plus the path-level write verb (§7.2). At 400px the note wraps
         *above* the buttons rather than sharing their line, which is why this is a column and not the
         row `#repo` and `#settings` use. */
      #panel .panel-foot {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      #panel .panel-foot .foot-row {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }
      /* The single-set card: no border, no padding, no heading (§3.2). It exists as a class rather
         than as a bare `div` so the markup says which of the two shapes it is. */
      .card {
        margin-bottom: 10px;
      }
      .set-section {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 10px;
      }
      .set-section > h3 {
        margin: 0 0 6px;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      .field > label {
        flex: none;
        width: 84px;
        color: var(--muted);
      }
      .field > input,
      .field > select {
        flex: 1;
        min-width: 0;
      }
      .field .unit {
        flex: none;
        width: 52px;
      }
      /*
        Labels above their fields, everywhere in the overlay — `edit-view-redesign.md` §4.1, §10.3.

        Scoped to `#panel` rather than replacing `.field` outright, because `#settings` uses the same
        class for its own label-beside-control rows and restyling those is not this change. Inside the
        card the 84px gutter and the 90px note margin below are one decision and move together (§12):
        ~90px of width recovered on every value, every resolve line and every dotted path at the 400px
        floor, for ~14px of height per field. Width is the scarce axis; height is not.

        10px, `--muted`, sentence case — deliberately **not** uppercase. The panel's one uppercase
        treatment is the path picker's group label, where it separates three groups of results, and
        spending that distinction on fifteen field labels in a row would retire it.
      */
      #panel .field {
        display: block;
        margin-bottom: 8px;
      }
      #panel .field > label {
        display: block;
        width: auto;
        margin-bottom: 4px;
        font-size: 10px;
        color: var(--muted);
      }
      /* A bare select in a card row — grid `pattern`, shadow `inset` — takes the field's full width,
         so it lines up with the shells above and below it rather than sitting at its text width. */
      #panel .field > select {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      /*
        The value shell — §4.3, and the **one** new class this redesign adds.

        A bordered flex row that looks like the text input it contains: the input inside it loses its
        own border and background, so the swatch, the value and any trailing control read as one
        field. The amber refusal moves to the shell for the same reason — the input has no border of
        its own left to colour.

        No trailing chevron. The reference screenshot's is its value-type dropdown, which is precisely
        the mode toggle `references-math-themes.md` §4.1 refused; adding it here would reintroduce the
        phase's one load-bearing rejection as decoration.
      */
      .value-shell {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
      }
      .value-shell:focus-within {
        border-color: var(--accent);
      }
      .value-shell.invalid {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      .value-shell > input[type="text"] {
        /* `8ch` rather than `0`, so the shell wraps a trailing control onto a second line at 400px
           instead of squeezing the value down to nothing (§5's `guessed` badge case). */
        flex: 1 1 8ch;
        min-width: 8ch;
        border: 0;
        background: transparent;
        padding: 2px 0;
      }
      .value-shell > input[type="text"]:focus {
        outline: none;
      }
      /* The swatch inside the shell is the row chip: `swatchMark()` + `.swatch-wrap` / `.swatch-fill`,
         the same call under the same resolution (§4.3, §12). Nothing here restyles it — this rule only
         says it is a click target and must not shrink. */
      .value-shell .shell-swatch {
        cursor: pointer;
      }
      /* The native colour input stays as the hidden *mechanism* behind the chip rather than being
         dressed up as one (§12). Not `display: none` — an unrendered input cannot be opened by
         `showPicker()` in every engine. */
      .hidden-picker {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      /* Trailing controls stay trailing, inside the shell, at a fixed width (§4.4): 52px for a unit,
         84px for a subtype. */
      .value-shell .subtype,
      .value-shell .subtype-group > select {
        flex: none;
        width: 84px;
      }
      .value-shell .subtype-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      /* §5.6's two-up member pairing. A static layout rule with one condition, and the condition is
         handled in `card.ts` — by the time a pair reaches this rule it is a pair. */
      .field-pair {
        display: flex;
        gap: 8px;
      }
      .field-pair > * {
        flex: 1;
        min-width: 0;
      }
      .field-note {
        margin: -3px 0 6px;
        /* Grey by default. Amber is `.warn`, and it is added only by a *refusal* — a value the user
           just committed on purpose (rule 4, the no-op nudge) needs nothing from them, and amber
           that appears on a correct action is how `⚑` stops meaning anything (UX §5.4, §6.5). */
        color: var(--muted);
      }
      .field-note.warn {
        color: var(--warn);
      }
      /* The resolve line — grey, and deliberately **not a badge** (UX §6.2). Nothing about an
         expression is amber unless it fails to parse or evaluate. */
      .resolve-line {
        /* Aligned to the field's own left edge, which is also where the eye already is — the 90px
           gutter went with the labels (§4.1, §12). */
        margin: -3px 0 6px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .resolve-line .muted,
      .cycle-step .muted {
        color: var(--muted);
      }
      /* One grey utility, used where a value line carries a second, subordinate fact — an
         expression's computed number beside the formula it came from (UX §6.3). */
      .muted {
        color: var(--muted);
      }
      .cycle-block {
        margin: 6px 0;
      }
      /* The pre-push refusal (ADR-0002 Amendment 3). Bordered and bold rather than red: dark mode
         §4 keeps red a button colour, and this is a state, not an action. */
      .push-block {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 8px;
        margin: 6px 0;
        background: var(--bg-subtle);
      }
      .push-block p {
        margin: 4px 0 0;
      }
      .cycle-steps {
        margin: 4px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .cycle-step {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cycle-step button {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        cursor: pointer;
      }
      .subrow {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px;
        margin-bottom: 6px;
      }
      .subrow > .subhead {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        color: var(--muted);
      }
      .subrow > .subhead .grow {
        flex: 1;
      }
      .ref-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 1px dashed var(--border);
        border-radius: 4px;
        background: var(--bg-subtle);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .ref-chip .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Description — a two-row textarea, because newlines are preserved rather than stripped
         (§7.1). `$description` is a string and DTCG permits them; the tree row and the push diff
         already show the first line. */
      textarea.desc-input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
      }
      /*
        The Figma section — one disclosure per card (§6.1).

        The summary row carries `Figma · <Source>`, so collapsing folds away the ids, the scopes and
        the bindings but never the provenance `local-editor.md` §5.2 promises is always shown.
      */
      .figma-section {
        margin: 8px 0;
        border-top: 1px solid var(--border);
        padding-top: 6px;
      }
      .figma-section > summary {
        cursor: pointer;
        color: var(--muted);
      }
      .provenance {
        color: var(--muted);
        margin-top: 6px;
        word-break: break-all;
      }
      /* `Bound in Figma` — a plain muted sub-heading rather than a nested `<details>`, because nested
         disclosures at 400px are a maze (§6.1). The `text` extras keep theirs: eleven rows of Figma
         internals nobody reads is exactly what a disclosure is for. */
      .provenance .sub-head {
        margin-top: 6px;
      }
      /* A collapsed shadow layer's own toggle — §5.6. Text, not a button: it sits in the `.subhead`
         beside `↑` and `Remove`, which are the buttons. */
      .subrow > .subhead .layer-toggle {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .conflict-box {
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        background: var(--warn-bg);
        padding: 6px 8px;
        margin-bottom: 8px;
      }
      .conflict-box .actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      /* ---------------- Crash screen (Phase 9, UX error-states.md §3) ---------------- */

      #crash {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: var(--bg-raised);
        padding: 16px;
        overflow: auto;
      }
      .crash-card h2 {
        margin: 4px 0 8px;
        font-size: 13px;
      }
      .crash-card p {
        margin: 0 0 10px;
      }
      .crash-card .entry {
        /* Deliberately the same .entry as every notice in the panel: this is a bigger surface, not
           a new visual language, and the phase adds no colour (UX §1). */
        margin-bottom: 12px;
      }
      .crash-card .entry > div {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-word;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--toast-bg);
        color: var(--toast-text);
        box-shadow: var(--shadow-modal);
        padding: 6px 12px;
        border-radius: 5px;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
        max-width: 92vw;
      }
      #toast.show {
        opacity: 1;
        pointer-events: auto;
      }
      .toast-action {
        border: none;
        background: none;
        color: var(--toast-action);
        padding: 0;
        font: inherit;
        cursor: pointer;
      }
      .toast-action:hover {
        background: none;
        text-decoration: underline;
      }
      /* ---------------- Phase 5: apply, drift, delete ---------------- */

      .chip.ok,
      .ok-line {
        color: var(--ok);
      }
      .chip.ok {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .ok-line {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--on-fill);
      }
      button.danger:hover {
        background: var(--danger);
        filter: var(--fill-hover);
      }
      /* The menu label, and the only other place red is allowed. */
      .popover .item.danger {
        color: var(--danger-text);
      }
      .popover .divider {
        height: 1px;
        background: var(--border);
        margin: 4px 6px;
      }

      /*
        The apply dialog — the panel's first and only dimmed backdrop (UX §5.2).

        Phase 4's anti-modal rule survives intact: it refused a centred modal for *editing*,
        because at 460×640 backdrop plus chrome eats a third of a workspace you need to stay in.
        A confirmation is the opposite shape of thing — transient, one decision, free to dismiss —
        and the full-panel overlay is wrong for it precisely because that chrome reads as "you have
        gone to a new screen". The dimmed tree behind the card is doing real work: it says you are
        still on the Tokens tab.
      */
      #modal {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--scrim);
      }
      .modal-card {
        display: flex;
        flex-direction: column;
        width: 100%;
        /* Sized to content, capped at roughly two-thirds of the panel; the list scrolls inside. */
        max-height: 66%;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow-modal);
        overflow: hidden;
      }
      .modal-head {
        flex: none;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head .grow {
        flex: 1;
        min-width: 0;
      }
      .modal-head .title {
        font-weight: 500;
      }
      .modal-head .sub {
        color: var(--muted);
      }
      .modal-close {
        flex: none;
        border: none;
        background: none;
        color: var(--muted);
        padding: 0 4px;
        cursor: pointer;
      }
      .modal-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px 12px;
      }
      /* The footer never scrolls: a 40-row apply must not push the button off the bottom. */
      .modal-foot {
        flex: none;
        border-top: 1px solid var(--border);
        padding: 8px 12px;
      }
      .modal-foot .note {
        color: var(--muted);
        margin-bottom: 6px;
      }
      .modal-foot .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-foot .actions .grow {
        flex: 1;
      }
      .plan-group {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        margin: 8px 0 4px;
      }
      .plan-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .plan-row .grow {
        flex: 1;
        min-width: 0;
      }
      .plan-row .path {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .plan-row .diff {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .plan-row .diff .to {
        color: var(--text);
      }
      .plan-row.blocked {
        color: var(--muted);
      }
      .plan-row .why {
        color: var(--warn);
      }
      .plan-row .dot {
        flex: none;
        width: 13px;
        text-align: center;
        color: var(--ok);
      }
      .plan-row input[type="checkbox"] {
        flex: none;
        margin: 2px 0 0;
      }
      /* The resolved literal under a pointer: informative, never mistakable for the value. */
      .plan-row .resolved {
        color: var(--muted);
        font-size: 10px;
      }

      #clipboard {
        position: absolute;
        left: -9999px;
        top: 0;
      }
      #views {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1 id="file-name">Tokenvault</h1>
        <button id="scan" class="primary">Scan file</button>
      </div>
      <div class="header-row">
        <nav class="tabs">
          <button id="tab-import" class="tab active">Import</button>
          <button id="tab-tokens" class="tab" disabled title="Scan the file first">Tokens</button>
          <!-- Phase 6's third top-level tab (UX git-sync §4.1, §6.2). A sibling of Import and
               Tokens, not a section tab on the Changes list: reviewing a diff, choosing files and
               writing a commit message is work, and tabs are for places you work. -->
          <button id="tab-repo" class="tab">Repo</button>
        </nav>
        <!-- The settings gear (UX git-sync §5.1). Carries one state mark and only one: an amber
             flag when the connection is broken. No count, no green dot when healthy. -->
        <button id="gear" class="gear" title="Settings">⚙</button>
        <!-- The header's state slot. Phase 4 puts the "Local edits · N" chip here; Phase 6's
             sync pill lands in the same slot, absorbing this state as "uncommitted". -->
        <div id="state-slot"></div>
      </div>
    </header>
    <div id="views">
      <main id="content">
        <p class="empty" id="intro">
          Reads every variable collection and mode (ADR-0002) and every paint, text, effect and grid
          style (ADR-0003) in this file, and generates the merged DTCG token tree. Nothing is written
          to Figma or to git — git sync lands in Phase 6.
        </p>
      </main>
      <div id="tokens" class="hidden">
        <div class="filters" id="tokens-filters"></div>
        <div id="tokens-notices"></div>
        <div id="tokens-scroll"><div id="tokens-canvas"></div></div>
      </div>
      <!-- The Repo tab's own view. Its three screens — Review & push, Diverged files, Compare —
           are rendered into it and pushed with a back arrow that preserves state (UX §7.2, §9.2). -->
      <div id="repo" class="hidden"></div>
      <div id="panel" class="hidden"></div>
      <!-- The Settings overlay (UX §5.2): full-panel with a back arrow, reachable from every tab,
           so it sits outside the tab views rather than inside one of them. -->
      <div id="settings" class="hidden"></div>
      <!-- The apply dialog's backdrop. Inside #views so it dims the tree, not the header —
           the header is what tells you where you still are. -->
      <div id="modal" class="hidden"></div>
    </div>
    <!-- The crash screen (UX error-states.md §3). Outside #views, and the only surface that covers
         the header: once the panel can't be trusted to render a notice inside itself, the tab strip
         and the state chip are claims it can no longer make. -->
    <div id="crash" class="hidden"></div>
    <div id="toast"></div>
    <textarea id="clipboard"></textarea>
    <script>
      /* esbuild inlines main.ts here at build time — see scripts/build.mjs */
    </script>
  </body>
</html>
