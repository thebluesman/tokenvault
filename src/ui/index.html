<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tokenvault</title>
    <style>
      :root {
        --border: #e6e6e6;
        --muted: #8c8c8c;
        --bg-subtle: #f5f5f5;
        --accent: #0d99ff;
        --warn: #b8730a;
        --warn-bg: #fff6e5;
        /*
          Phase 5 adds two colours, both tightly fenced (UX apply-and-drift §8).

          --ok is the "agreed" green: muted and desaturated, deliberately quieter than the amber
          it sits beside, because a confirmation must never out-shout a warning. It appears in
          exactly three places — the header chip, the detail overlay's per-set in-sync line, and
          the apply dialog's `already matches` rows — and never on a tree row or a value line,
          where in-sync stays signalled by the *absence* of a badge across 1,316 tokens.

          --danger is a **button and menu-label colour, not a state colour**. Phase 4's ban on a
          third badge colour is intact: nothing in a row or a banner turns red. Red here means
          exactly one thing — this control destroys something in the file, and no second apply
          brings it back.
        */
        --ok: #2f7d55;
        --ok-bg: #eef7f1;
        --danger: #c4382f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 11px;
        line-height: 1.45;
        color: #1a1a1a;
      }
      header {
        flex: none;
        z-index: 2;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      .header-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
      }
      .header-row + .header-row {
        padding-top: 0;
      }
      header h1 {
        flex: 1;
        font-size: 12px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs {
        display: flex;
        gap: 2px;
        flex: 1;
      }
      .tab {
        padding: 3px 10px;
        border-radius: 5px;
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
      }
      .tab.active {
        background: var(--bg-subtle);
        border-color: var(--border);
        color: #1a1a1a;
      }
      .tab:disabled {
        opacity: 0.45;
        cursor: default;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--bg-subtle);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        filter: brightness(0.93);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      select,
      input[type="text"],
      input[type="search"],
      textarea.field {
        font: inherit;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        color: inherit;
      }
      input:disabled {
        background: var(--bg-subtle);
        color: var(--muted);
      }
      input.invalid {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      section {
        margin-bottom: 18px;
      }
      section > h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .count {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 5px 8px;
        min-width: 62px;
      }
      .count b {
        display: block;
        font-size: 14px;
      }
      .count span {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .row .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row .meta {
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 10px;
        background: var(--bg-subtle);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.needs {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
      }
      .entry {
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
      }
      .entry .kind {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--warn);
      }
      /* partial-token / redundant-style: imported, not lost — so not styled as a failure. */
      .entry.info {
        border-left-color: var(--border);
      }
      .entry.info .kind {
        color: var(--muted);
      }
      .entry > div:first-child {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      details.file {
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 6px;
      }
      details.file > summary {
        cursor: pointer;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      details.file > summary .grow {
        flex: 1;
      }
      pre {
        margin: 0;
        padding: 8px;
        background: var(--bg-subtle);
        border-top: 1px solid var(--border);
        max-height: 260px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .empty {
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* ---------------- Tokens tab (Phase 4) ---------------- */

      #tokens {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .filters {
        flex: none;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filters input[type="search"] {
        width: 100%;
        padding: 4px 6px;
      }
      .chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 2px 7px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .chip.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      .chip.warn.on {
        border-color: var(--warn);
        color: var(--warn);
        background: var(--warn-bg);
      }

      /* --- Phase 6: git sync (UX docs/ux/git-sync.md) --------------------- */

      /* The gear (§5.1). One state mark only: amber when the connection is broken. A settings icon
         that is decorated when everything is fine teaches the user to ignore its decoration. */
      .gear {
        flex: none;
        padding: 2px 6px;
        border: 1px solid transparent;
        background: none;
        color: var(--muted);
      }
      .gear.needs {
        color: var(--warn);
        border-color: var(--warn);
        background: var(--warn-bg);
      }

      /* One chip, two halves, split by a hairline divider — §6.1. Left is Figma, right is the repo,
         and the divider is doing semantic work rather than decoration: it is what makes "in sync
         with what" answerable without a word. Two tap targets, two destinations (§4.1). */
      .sync-chip {
        display: inline-flex;
        align-items: stretch;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .sync-chip > button {
        border: none;
        background: none;
        color: var(--muted);
        padding: 2px 7px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .sync-chip > button + button {
        border-left: 1px solid var(--border);
      }
      .sync-chip.on {
        border-color: var(--accent);
      }
      .sync-chip.on > button {
        color: var(--accent);
      }
      .sync-chip.warn {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      .sync-chip.warn > button {
        color: var(--warn);
      }
      .sync-chip > button.ok {
        color: var(--ok);
      }

      #repo,
      #settings {
        position: absolute;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #repo {
        z-index: 5;
      }
      /* Above the Changes panel (20) because Settings is reachable from every tab, and below the
         modal (30) because the phase's one modal — first connect — opens over Settings. Stated as
         numbers rather than left to document order: a connect question rendered *under* the
         overlay that raised it is unanswerable. */
      #settings {
        z-index: 25;
      }
      #repo .panel-head,
      #settings .panel-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      #repo .panel-head .title,
      #settings .panel-head .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #repo .panel-body,
      #settings .panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      /* The pinned footer every screen in this tab shares — the list scrolls against the panel and
         the write verb never scrolls out of reach (§7.2). */
      .panel-foot {
        flex: none;
        border-top: 1px solid var(--border);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-foot .grow {
        flex: 1;
      }
      .panel-foot .note {
        color: var(--muted);
      }
      /* Files, not tokens, at the top level — §6.2. This is the one place in the panel whose unit
         is a file, because it is the place about the repo (§3). */
      .file-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .file-row .fname {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .file-row .fcount {
        color: var(--muted);
        white-space: nowrap;
      }
      .repo-section {
        margin: 0 0 14px;
      }
      .repo-section > h3 {
        margin: 0 0 4px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .file-children {
        padding: 4px 0 6px 18px;
      }
      .more-line {
        color: var(--muted);
        cursor: pointer;
        padding: 2px 0;
      }
      .msg-field {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 6px;
      }
      /* §10.4's one new component: a footer strip replacing the bulk button in place. Nothing
         dims, nothing overlays, and the rows the user is being asked about stay visible behind it. */
      .confirm-strip {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: 8px;
      }
      .confirm-strip .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .confirm-strip .actions .grow {
        flex: 1;
      }
      /* The token field is write-only and looks it — §5.2, ADR-0006 §1. Inert, never a `value`. */
      .pat-field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pat-mask {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
        color: var(--muted);
        background: var(--bg-subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #tokens-notices {
        flex: none;
        padding: 8px 12px 0;
      }
      #tokens-notices:empty {
        padding: 0;
      }
      #tokens-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        position: relative;
      }
      #tokens-canvas {
        position: relative;
      }
      .tnode {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        overflow: hidden;
      }
      .tnode.group {
        cursor: pointer;
        background: #fff;
      }
      .tnode.group:hover,
      .tnode.token:hover {
        background: var(--bg-subtle);
      }
      .tline {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 18px;
      }
      .tline.head {
        height: 20px;
      }
      .caret {
        width: 10px;
        flex: none;
        color: var(--muted);
      }
      .tname {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .tname.group-name {
        font-family: Inter, "Segoe UI", sans-serif;
        font-weight: 500;
      }
      .tname mark {
        background: #fff2a8;
        color: inherit;
      }
      .vline {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        min-width: 0;
      }
      .vline .val {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: text;
      }
      .vline .val.readonly {
        cursor: default;
        color: var(--muted);
      }
      .vline .val.edited {
        color: var(--accent);
      }
      .setcode {
        flex: none;
        color: var(--muted);
        font-size: 10px;
        min-width: 38px;
      }
      .setcode.derived {
        font-style: italic;
      }
      .glyph {
        flex: none;
        width: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 10px;
      }
      .swatch {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background-color: #fff;
        background-image: linear-gradient(45deg, #ddd 25%, transparent 25%),
          linear-gradient(-45deg, #ddd 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #ddd 75%),
          linear-gradient(-45deg, transparent 75%, #ddd 75%);
        background-size: 6px 6px;
        background-position: 0 0, 0 3px, 3px -3px, -3px 0;
      }
      .swatch-wrap {
        flex: none;
        position: relative;
        width: 12px;
        height: 12px;
      }
      .swatch-fill {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .swatch.outlined {
        background-image: none;
        border-style: dashed;
      }
      .menu-btn {
        flex: none;
        border: none;
        background: none;
        padding: 0 3px;
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
      }
      .menu-btn:hover {
        background: none;
        color: #1a1a1a;
      }
      .count-right {
        flex: none;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .inline-edit {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .popover {
        position: fixed;
        z-index: 40;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        padding: 4px;
        max-width: 300px;
        max-height: 380px;
        overflow: auto;
      }
      .popover .item {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 4px 8px;
        border: none;
        background: none;
        border-radius: 4px;
        text-align: left;
        cursor: pointer;
      }
      .popover .item:hover {
        background: var(--bg-subtle);
      }
      .popover .item:disabled {
        color: var(--muted);
        cursor: default;
      }
      .popover .item:disabled:hover {
        background: none;
      }
      .popover .group-label {
        padding: 4px 8px 2px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
      }

      #panel {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #panel .panel-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      #panel .panel-head .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #panel .panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }
      .set-section {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 10px;
      }
      .set-section > h3 {
        margin: 0 0 6px;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      .field > label {
        flex: none;
        width: 84px;
        color: var(--muted);
      }
      .field > input,
      .field > select {
        flex: 1;
        min-width: 0;
      }
      .field .unit {
        flex: none;
        width: 52px;
      }
      .field-note {
        margin: -3px 0 6px 90px;
        /* Grey by default. Amber is `.warn`, and it is added only by a *refusal* — a value the user
           just committed on purpose (rule 4, the no-op nudge) needs nothing from them, and amber
           that appears on a correct action is how `⚑` stops meaning anything (UX §5.4, §6.5). */
        color: var(--muted);
      }
      .field-note.warn {
        color: var(--warn);
      }
      /* The resolve line — grey, and deliberately **not a badge** (UX §6.2). Nothing about an
         expression is amber unless it fails to parse or evaluate. */
      .resolve-line {
        margin: -3px 0 6px 90px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .resolve-line .muted,
      .cycle-step .muted {
        color: var(--muted);
      }
      /* One grey utility, used where a value line carries a second, subordinate fact — an
         expression's computed number beside the formula it came from (UX §6.3). */
      .muted {
        color: var(--muted);
      }
      .cycle-block {
        margin: 6px 0;
      }
      .cycle-steps {
        margin: 4px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .cycle-step {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cycle-step button {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        cursor: pointer;
      }
      .subrow {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px;
        margin-bottom: 6px;
      }
      .subrow > .subhead {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        color: var(--muted);
      }
      .subrow > .subhead .grow {
        flex: 1;
      }
      .ref-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 1px dashed var(--border);
        border-radius: 4px;
        background: var(--bg-subtle);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .ref-chip .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .provenance {
        color: var(--muted);
        margin-top: 6px;
        word-break: break-all;
      }
      .conflict-box {
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        background: var(--warn-bg);
        padding: 6px 8px;
        margin-bottom: 8px;
      }
      .conflict-box .actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #1a1a1a;
        color: #fff;
        padding: 6px 12px;
        border-radius: 5px;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
        max-width: 92vw;
      }
      #toast.show {
        opacity: 1;
        pointer-events: auto;
      }
      .toast-action {
        border: none;
        background: none;
        color: #7cc4ff;
        padding: 0;
        font: inherit;
        cursor: pointer;
      }
      .toast-action:hover {
        background: none;
        text-decoration: underline;
      }
      /* ---------------- Phase 5: apply, drift, delete ---------------- */

      .chip.ok,
      .ok-line {
        color: var(--ok);
      }
      .chip.ok {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .ok-line {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      button.danger:hover {
        background: var(--danger);
        filter: brightness(0.92);
      }
      /* The menu label, and the only other place red is allowed. */
      .popover .item.danger {
        color: var(--danger);
      }
      .popover .divider {
        height: 1px;
        background: var(--border);
        margin: 4px 6px;
      }

      /*
        The apply dialog — the panel's first and only dimmed backdrop (UX §5.2).

        Phase 4's anti-modal rule survives intact: it refused a centred modal for *editing*,
        because at 460×640 backdrop plus chrome eats a third of a workspace you need to stay in.
        A confirmation is the opposite shape of thing — transient, one decision, free to dismiss —
        and the full-panel overlay is wrong for it precisely because that chrome reads as "you have
        gone to a new screen". The dimmed tree behind the card is doing real work: it says you are
        still on the Tokens tab.
      */
      #modal {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.32);
      }
      .modal-card {
        display: flex;
        flex-direction: column;
        width: 100%;
        /* Sized to content, capped at roughly two-thirds of the panel; the list scrolls inside. */
        max-height: 66%;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
        overflow: hidden;
      }
      .modal-head {
        flex: none;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head .grow {
        flex: 1;
        min-width: 0;
      }
      .modal-head .title {
        font-weight: 500;
      }
      .modal-head .sub {
        color: var(--muted);
      }
      .modal-close {
        flex: none;
        border: none;
        background: none;
        color: var(--muted);
        padding: 0 4px;
        cursor: pointer;
      }
      .modal-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px 12px;
      }
      /* The footer never scrolls: a 40-row apply must not push the button off the bottom. */
      .modal-foot {
        flex: none;
        border-top: 1px solid var(--border);
        padding: 8px 12px;
      }
      .modal-foot .note {
        color: var(--muted);
        margin-bottom: 6px;
      }
      .modal-foot .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-foot .actions .grow {
        flex: 1;
      }
      .plan-group {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        margin: 8px 0 4px;
      }
      .plan-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .plan-row .grow {
        flex: 1;
        min-width: 0;
      }
      .plan-row .path {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .plan-row .diff {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .plan-row .diff .to {
        color: #1a1a1a;
      }
      .plan-row.blocked {
        color: var(--muted);
      }
      .plan-row .why {
        color: var(--warn);
      }
      .plan-row .dot {
        flex: none;
        width: 13px;
        text-align: center;
        color: var(--ok);
      }
      .plan-row input[type="checkbox"] {
        flex: none;
        margin: 2px 0 0;
      }
      /* The resolved literal under a pointer: informative, never mistakable for the value. */
      .plan-row .resolved {
        color: var(--muted);
        font-size: 10px;
      }

      #clipboard {
        position: absolute;
        left: -9999px;
        top: 0;
      }
      #views {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1 id="file-name">Tokenvault</h1>
        <button id="scan" class="primary">Scan file</button>
      </div>
      <div class="header-row">
        <nav class="tabs">
          <button id="tab-import" class="tab active">Import</button>
          <button id="tab-tokens" class="tab" disabled title="Scan the file first">Tokens</button>
          <!-- Phase 6's third top-level tab (UX git-sync §4.1, §6.2). A sibling of Import and
               Tokens, not a section tab on the Changes list: reviewing a diff, choosing files and
               writing a commit message is work, and tabs are for places you work. -->
          <button id="tab-repo" class="tab">Repo</button>
        </nav>
        <!-- The settings gear (UX git-sync §5.1). Carries one state mark and only one: an amber
             flag when the connection is broken. No count, no green dot when healthy. -->
        <button id="gear" class="gear" title="Settings">⚙</button>
        <!-- The header's state slot. Phase 4 puts the "Local edits · N" chip here; Phase 6's
             sync pill lands in the same slot, absorbing this state as "uncommitted". -->
        <div id="state-slot"></div>
      </div>
    </header>
    <div id="views">
      <main id="content">
        <p class="empty" id="intro">
          Reads every variable collection and mode (ADR-0002) and every paint, text, effect and grid
          style (ADR-0003) in this file, and generates the merged DTCG token tree. Nothing is written
          to Figma or to git — git sync lands in Phase 6.
        </p>
      </main>
      <div id="tokens" class="hidden">
        <div class="filters" id="tokens-filters"></div>
        <div id="tokens-notices"></div>
        <div id="tokens-scroll"><div id="tokens-canvas"></div></div>
      </div>
      <!-- The Repo tab's own view. Its three screens — Review & push, Diverged files, Compare —
           are rendered into it and pushed with a back arrow that preserves state (UX §7.2, §9.2). -->
      <div id="repo" class="hidden"></div>
      <div id="panel" class="hidden"></div>
      <!-- The Settings overlay (UX §5.2): full-panel with a back arrow, reachable from every tab,
           so it sits outside the tab views rather than inside one of them. -->
      <div id="settings" class="hidden"></div>
      <!-- The apply dialog's backdrop. Inside #views so it dims the tree, not the header —
           the header is what tells you where you still are. -->
      <div id="modal" class="hidden"></div>
    </div>
    <div id="toast"></div>
    <textarea id="clipboard"></textarea>
    <script>
      /* esbuild inlines main.ts here at build time — see scripts/build.mjs */
    </script>
  </body>
</html>
