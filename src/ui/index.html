<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tokenvault</title>
    <style>
      :root {
        --border: #e6e6e6;
        --muted: #8c8c8c;
        --bg-subtle: #f5f5f5;
        --accent: #0d99ff;
        --warn: #b8730a;
        --warn-bg: #fff6e5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 11px;
        line-height: 1.45;
        color: #1a1a1a;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        flex: 1;
        font-size: 12px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      main {
        padding: 12px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--bg-subtle);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        filter: brightness(0.93);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      select {
        font: inherit;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
      }
      section {
        margin-bottom: 18px;
      }
      section > h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .counts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .count {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 5px 8px;
        min-width: 62px;
      }
      .count b {
        display: block;
        font-size: 14px;
      }
      .count span {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .row .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row .meta {
        color: var(--muted);
        white-space: nowrap;
      }
      .badge {
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 10px;
        background: var(--bg-subtle);
        color: var(--muted);
      }
      .badge.needs {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
      }
      .entry {
        border: 1px solid var(--border);
        border-left: 3px solid var(--warn);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 6px;
      }
      .entry .kind {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--warn);
      }
      /* partial-token / redundant-style: imported, not lost — so not styled as a failure. */
      .entry.info {
        border-left-color: var(--border);
      }
      .entry.info .kind {
        color: var(--muted);
      }
      .entry > div:first-child {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      details.file {
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 6px;
      }
      details.file > summary {
        cursor: pointer;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      details.file > summary .grow {
        flex: 1;
      }
      pre {
        margin: 0;
        padding: 8px;
        background: var(--bg-subtle);
        border-top: 1px solid var(--border);
        max-height: 260px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }
      .empty {
        color: var(--muted);
      }
      .hidden {
        display: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        background: #1a1a1a;
        color: #fff;
        padding: 6px 12px;
        border-radius: 5px;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      #clipboard {
        position: absolute;
        left: -9999px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="file-name">Tokenvault</h1>
      <button id="scan" class="primary">Scan file</button>
    </header>
    <main id="content">
      <p class="empty" id="intro">
        Reads every variable collection and mode (ADR-0002) and every paint, text, effect and grid
        style (ADR-0003) in this file, and generates the merged DTCG token tree. Nothing is written
        to Figma or to git — git sync lands in Phase 6.
      </p>
    </main>
    <div id="toast"></div>
    <textarea id="clipboard"></textarea>
    <script>
      /* esbuild inlines main.ts here at build time — see scripts/build.mjs */
    </script>
  </body>
</html>
